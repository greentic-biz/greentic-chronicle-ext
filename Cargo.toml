[workspace]
resolver = "3"
members = [
    # restored as crates land (tasks 2, 9, 15, 16)
    "crates/chronicle-core",
    "crates/chronicle-testkit",
    "crates/chronicle-driver-neo4j",
    "crates/chronicle-llm-openai",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/greentic-biz/greentic-chronicle-ext"
rust-version = "1.95"

[workspace.dependencies]
chronicle-core = { path = "crates/chronicle-core" }
chronicle-testkit = { path = "crates/chronicle-testkit" }
chronicle-driver-neo4j = { path = "crates/chronicle-driver-neo4j" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake2 = "0.10"
tracing = "0.1"
rand = "0.9"
neo4rs = "0.8"
async-openai = { version = "0.40", default-features = false, features = [
    "rustls",
    "chat-completion",
    "embedding",
] }
anyhow = "1"
